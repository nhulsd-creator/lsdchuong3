<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#7B1015">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Chương 3">
<meta name="description" content="Bài tập thực hành Lịch sử Đảng Cộng sản Việt Nam – Chương 3 (1975 đến nay)">
<title>Chương 3 · Lịch sử Đảng – Bài tập thực hành</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%237B1015'/%3E%3Ctext x='32' y='48' font-family='Georgia,serif' font-weight='700' font-size='44' text-anchor='middle' fill='%23E2B65B'%3E3%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,700;0,800;1,500&display=swap">
<style>
/* Layout: sổ ôn tập — dải thời gian 1975→nay làm trục điều hướng, nội dung một cột 960px, thanh tab dính đầu trang */
:root{
  --bg:#F2F3F5; --surface:#FFFFFF; --surface-2:#EAECF0; --ink:#1B1E25; --muted:#5D6472; --line:#D8DBE2;
  --accent:#A3171C; --accent-ink:#FFFFFF; --accent-soft:#F7E4E3; --gold:#9C7412; --gold-soft:#F5EDD6;
  --ok:#1D7349; --ok-soft:#DFF1E6; --bad:#B3261E; --bad-soft:#FBE5E2;
  --p1:#A3171C; --p2:#C0571A; --p3:#9C7412; --p4:#2B6C5E;
  --shadow:0 1px 2px rgba(20,22,30,.06),0 4px 14px rgba(20,22,30,.05);
  --f-display:'Literata',Georgia,'Times New Roman',serif;
  --f-body:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121419; --surface:#1A1D24; --surface-2:#242832; --ink:#E9EBF0; --muted:#9BA2B1; --line:#2E333E;
  --accent:#E2554C; --accent-ink:#16090A; --accent-soft:#3A1E1F; --gold:#D8AE4E; --gold-soft:#352C17;
  --ok:#4CC488; --ok-soft:#173326; --bad:#F27A6E; --bad-soft:#3A1D1B;
  --p1:#E2554C; --p2:#E9894A; --p3:#D8AE4E; --p4:#5FB8A4;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#121419; --surface:#1A1D24; --surface-2:#242832; --ink:#E9EBF0; --muted:#9BA2B1; --line:#2E333E;
  --accent:#E2554C; --accent-ink:#16090A; --accent-soft:#3A1E1F; --gold:#D8AE4E; --gold-soft:#352C17;
  --ok:#4CC488; --ok-soft:#173326; --bad:#F27A6E; --bad-soft:#3A1D1B;
  --p1:#E2554C; --p2:#E9894A; --p3:#D8AE4E; --p4:#5FB8A4;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark;}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.25}
.tnum{font-variant-numeric:tabular-nums}

/* Header */
.masthead{background:var(--surface);border-bottom:1px solid var(--line);border-top:5px solid var(--accent)}
.masthead .wrap{padding-block:22px 18px;display:grid;gap:14px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.masthead h1{font-size:clamp(22px,3.6vw,32px);font-weight:700;max-width:30ch}
.masthead h1 em{font-style:normal;color:var(--accent)}
.head-row{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:flex-end;justify-content:space-between}
.stats{display:flex;gap:18px;flex-wrap:wrap}
.stat{display:grid}
.stat b{font-size:20px;font-family:var(--f-display);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}

/* Timeline */
.tl{position:relative;padding-top:22px}
.tl-bar{display:flex;height:30px;border-radius:6px;overflow:hidden;gap:2px}
.tl-seg{border:0;padding:0 8px;color:#fff;font-size:12px;font-weight:600;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.82;transition:opacity .15s, transform .15s}
.tl-seg:hover{opacity:1}
.tl-seg.on{opacity:1;box-shadow:inset 0 -4px 0 rgba(0,0,0,.25)}
.tl-bar.has-sel .tl-seg:not(.on){opacity:.35}
.tl-seg[data-p="1"]{background:var(--p1)} .tl-seg[data-p="2"]{background:var(--p2)}
.tl-seg[data-p="3"]{background:var(--p3)} .tl-seg[data-p="4"]{background:var(--p4)}
:root[data-theme="dark"] .tl-seg{color:#111}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tl-seg{color:#111}}
.tl-mk{position:absolute;top:0;transform:translateX(-50%);font-size:11px;font-weight:700;color:var(--muted);text-align:center;line-height:1}
.tl-mk::after{content:"";display:block;width:1px;height:8px;background:var(--muted);margin:3px auto 0;opacity:.6}
.tl-years{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:4px}

/* Tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.tabs .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs .wrap::-webkit-scrollbar{display:none}
.tab{background:none;border:0;padding:13px 12px 11px;font-size:14px;font-weight:500;color:var(--muted);white-space:nowrap;border-bottom:3px solid transparent}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.tab .cnt{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--bad-soft);color:var(--bad);font-size:11px;margin-left:4px;text-align:center}

main{padding-block:20px 60px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.chip .dot{width:8px;height:8px;border-radius:50%}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sp{flex:1}
select.sel{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font:inherit;font-size:13px;color:var(--ink)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.sec-title{font-size:20px;margin:28px 0 12px}
.sec-title:first-child{margin-top:4px}
.lead{color:var(--muted);margin:0 0 16px;max-width:68ch}
.ptag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--muted)}
.ptag i{width:8px;height:8px;border-radius:2px;display:inline-block}
.lvl{font-size:11px;font-weight:600;padding:2px 7px;border-radius:5px;background:var(--surface-2);color:var(--muted)}

/* Quiz card */
.qcard{padding:22px}
.qmeta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.qnum{font-weight:700;font-variant-numeric:tabular-nums;color:var(--accent)}
.qtext{font-size:17px;font-weight:600;line-height:1.5;margin:0 0 16px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:9px;padding:11px 14px;transition:border-color .12s,background .12s}
.opt:hover:not(:disabled){border-color:var(--muted)}
.opt .k{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;background:var(--surface-2)}
.opt .t{min-width:0;padding-top:2px}
.opt.pick{border-color:var(--ink)}
.opt.pick .k{background:var(--ink);color:var(--bg)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .k{background:var(--ok);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);color:var(--surface)}
.opt:disabled{cursor:default}
.explain{margin-top:14px;padding:12px 14px;border-radius:9px;background:var(--surface-2);font-size:14px}
.explain b.ok{color:var(--ok)} .explain b.bad{color:var(--bad)}
.qnav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:18px;flex-wrap:wrap}
.dots{display:flex;flex-wrap:wrap;gap:4px;margin-top:14px}
.dots button{width:26px;height:26px;border-radius:6px;border:1px solid var(--line);background:var(--surface);font-size:11px;font-variant-numeric:tabular-nums;padding:0}
.dots button.cur{outline:2px solid var(--ink);outline-offset:1px}
.dots button.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.dots button.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.dots button.done{background:var(--surface-2);border-color:var(--muted)}
.progress{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin-top:6px}
.progress i{display:block;height:100%;background:var(--accent);transition:width .25s}
.hint-k{font-size:12px;color:var(--muted)}

/* Exam */
.exam-setup{padding:24px;display:grid;gap:16px}
.exam-setup .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.exam-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;margin-bottom:12px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 50px);z-index:4}
.timer{font-family:var(--f-display);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}
.result{padding:24px;display:grid;gap:18px}
.score-big{font-family:var(--f-display);font-size:54px;font-weight:700;line-height:1;color:var(--accent)}
.bars{display:grid;gap:10px}
.barrow{display:grid;grid-template-columns:120px 1fr 58px;gap:10px;align-items:center;font-size:13px}
.barrow .track{height:10px;background:var(--surface-2);border-radius:5px;overflow:hidden}
.barrow .track i{display:block;height:100%}
.review-item{padding:16px 18px;border-top:1px solid var(--line)}
.review-item:first-child{border-top:0}
.review-item .q{font-weight:600;margin-bottom:6px}
.ra{font-size:14px} .ra .ok{color:var(--ok);font-weight:600} .ra .bad{color:var(--bad);font-weight:600}

/* True/False */
.tf-list{display:grid;gap:10px}
.tf{padding:14px 16px;display:grid;gap:10px}
.tf .s{font-weight:500}
.tf .btn-row .btn{min-width:84px}
.tf .btn.picked-ok{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.tf .btn.picked-bad{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.tf .fb{font-size:14px;color:var(--muted)}
.tf .fb b{color:var(--ink)}

/* Matching */
.set-list{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.match{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px}
.mcol{display:grid;gap:8px;align-content:start;min-width:0}
.mcol h3{font-family:var(--f-body);font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.mi{display:flex;gap:10px;align-items:center;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:9px;padding:10px 12px;min-height:48px;font-size:14px}
.mi .b{flex:none;width:24px;height:24px;border-radius:6px;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--surface-2);color:var(--muted)}
.mi.sel{border-color:var(--accent);background:var(--accent-soft)}
.mi.paired .b{background:var(--ink);color:var(--bg)}
.mi.ok{border-color:var(--ok);background:var(--ok-soft)} .mi.ok .b{background:var(--ok);color:var(--surface)}
.mi.bad{border-color:var(--bad);background:var(--bad-soft)} .mi.bad .b{background:var(--bad);color:var(--surface)}
.mi span{min-width:0}
.note{font-size:13px;color:var(--muted)}
.result-line{font-weight:600;padding:10px 14px;border-radius:8px;background:var(--surface-2)}

/* Ordering */
.olist{display:grid;gap:8px;padding:16px}
.orow{display:grid;grid-template-columns:32px 1fr auto;gap:10px;align-items:center;border:1.5px solid var(--line);border-radius:9px;padding:8px 10px;background:var(--surface)}
.orow .pos{font-family:var(--f-display);font-weight:700;font-size:18px;text-align:center;color:var(--muted)}
.orow .tx{min-width:0}
.orow .dt{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.orow .mv{display:flex;gap:4px}
.orow .mv button{width:34px;height:34px;border-radius:7px;border:1px solid var(--line);background:var(--surface-2);font-size:15px;line-height:1}
.orow .mv button:disabled{opacity:.3}
.orow.ok{border-color:var(--ok);background:var(--ok-soft)} .orow.ok .pos{color:var(--ok)}
.orow.bad{border-color:var(--bad);background:var(--bad-soft)} .orow.bad .pos{color:var(--bad)}

/* Fill */
.fill-list{display:grid;gap:10px}
.fill{padding:14px 16px;display:grid;gap:10px}
.fill .s{font-weight:500}
.fill .s .blank{display:inline-block;min-width:70px;border-bottom:2px solid var(--accent);margin:0 2px}
.fill .inrow{display:flex;gap:8px;flex-wrap:wrap}
.fill input{flex:1 1 200px;min-width:0;border:1.5px solid var(--line);border-radius:8px;padding:8px 12px;font:inherit;background:var(--surface);color:var(--ink)}
.fill.ok input{border-color:var(--ok);background:var(--ok-soft)}
.fill.bad input{border-color:var(--bad);background:var(--bad-soft)}
.fill .fb{font-size:14px}
.fill .fb .ok{color:var(--ok);font-weight:600}.fill .fb .bad{color:var(--bad);font-weight:600}

/* Flashcards */
.fc-stage{perspective:1400px;margin:0 auto;max-width:640px}
.fc{position:relative;width:100%;min-height:260px;cursor:pointer;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.3,.7,.3,1);border:0;background:none;padding:0;text-align:left;display:block}
.fc.flip{transform:rotateY(180deg)}
.fc .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);overflow:auto}
.fc .front{border-top:5px solid var(--accent)}
.fc .front h3{font-size:22px;margin:auto 0}
.fc .back{transform:rotateY(180deg);background:var(--gold-soft);border-color:var(--gold)}
.fc .back p{margin:0;font-size:15.5px;line-height:1.65}
.fc .tip{font-size:12px;color:var(--muted);margin-top:auto}
.fc-ctrl{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:16px;flex-wrap:wrap}
.known-on{background:var(--ok)!important;border-color:var(--ok)!important;color:var(--surface)!important}

/* Overview */
.tbl-wrap{overflow-x:auto}
table.cong{width:100%;border-collapse:collapse;font-size:14px;min-width:720px}
table.cong th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface-2)}
table.cong td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
table.cong tr:last-child td{border-bottom:0}
table.cong td.n{font-family:var(--f-display);font-weight:700;font-size:18px;white-space:nowrap}
table.cong td.n i{display:inline-block;width:4px;height:18px;border-radius:2px;margin-right:8px;vertical-align:-3px}
table.cong td.d{white-space:nowrap;font-variant-numeric:tabular-nums}
table.cong .sub{display:block;font-size:12px;color:var(--muted)}
.nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.num{padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.num b{display:block;font-family:var(--f-display);font-size:24px;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1.1}
.num span{font-size:13px;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.list{margin:0;padding:0;list-style:none}
.list li{padding:11px 16px;border-top:1px solid var(--line);display:grid;gap:2px}
.list li:first-child{border-top:0}
.list li b{font-size:14px}
.list li span{font-size:13.5px;color:var(--muted)}
.list li span b{color:var(--ink)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.howto{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.howto button{text-align:left;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);display:grid;gap:4px}
.howto button:hover{border-color:var(--accent)}
.howto b{font-size:15px}
.howto span{font-size:13px;color:var(--muted)}
.foot{font-size:12px;color:var(--muted);text-align:center;padding-block:10px 30px}

@media (max-width:640px){
  .qcard{padding:16px}
  .match{grid-template-columns:1fr 1fr;gap:8px;padding:10px}
  .mi{padding:8px;font-size:13px;gap:6px}
  .two{grid-template-columns:1fr}
  .barrow{grid-template-columns:90px 1fr 50px}
  .tl-seg{font-size:0;padding:0}
  .tl-mk{font-size:9px}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%}
  .stat b{font-size:18px}
  .stat span{font-size:11px;line-height:1.3}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ===== Bổ sung cho bản web độc lập ===== */
:root{--f-display:'Playfair Display',Georgia,'Times New Roman',serif;--cover:#7B1015;--cover-2:#4E0A0D;--gilt:#E2B65B;--gilt-2:#F4DFA8;--cream:#FBF4E6}
html,body{margin:0}
body{min-height:100vh}

/* --- Tiêu đề chương trong app --- */
.mh-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.btn.sm{padding:5px 12px;font-size:13px}
.mh-title{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center;padding-block:6px 4px}
.chap{display:flex;flex-direction:column;align-items:center;line-height:1;padding-right:22px;border-right:2px solid var(--gold)}
.chap-word{font-family:var(--f-display);font-style:italic;font-weight:500;font-size:22px;color:var(--gold);letter-spacing:.02em}
.chap-num{font-family:var(--f-display);font-weight:800;font-size:86px;color:var(--accent);line-height:.9;margin-top:2px}
.chap-text h1{font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:.035em;font-size:clamp(17px,2.4vw,25px);line-height:1.35;max-width:36ch}
.chap-sub{margin-top:8px;font-family:var(--f-display);font-style:italic;font-size:17px;color:var(--muted);display:flex;align-items:center;gap:10px}
.chap-sub::before{content:"";width:34px;height:2px;background:var(--gold)}
.masthead .stats{border-top:1px solid var(--line);padding-top:12px}
@media (max-width:640px){
  .mh-title{grid-template-columns:1fr;gap:10px}
  .chap{flex-direction:row;align-items:baseline;gap:10px;border-right:0;padding-right:0;border-bottom:2px solid var(--gold);padding-bottom:6px;justify-self:start}
  .chap-num{font-size:58px}
}

/* --- Màn hình đăng nhập (trang bìa) --- */
#gate{min-height:100vh;display:grid;place-items:center;padding:32px 16px;color:var(--cream);
  background:
    radial-gradient(120% 80% at 50% 0%, rgba(255,214,140,.16), transparent 60%),
    repeating-linear-gradient(45deg, rgba(255,255,255,.025) 0 2px, transparent 2px 14px),
    linear-gradient(160deg,var(--cover),var(--cover-2));}
.cover{width:100%;max-width:640px;text-align:center;position:relative;padding:44px 28px 36px;border:1px solid rgba(226,182,91,.55);outline:1px solid rgba(226,182,91,.25);outline-offset:7px;border-radius:4px}
.cover .orn{display:flex;align-items:center;justify-content:center;gap:12px;color:var(--gilt)}
.cover .orn::before,.cover .orn::after{content:"";height:1px;width:72px;background:linear-gradient(90deg,transparent,var(--gilt))}
.cover .orn::after{transform:scaleX(-1)}
.cover .orn span{font-size:13px;letter-spacing:.32em;text-transform:uppercase;font-weight:600}
.cover .subject{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--gilt-2);opacity:.9;margin-top:14px}
.cv-chap{margin:18px 0 6px;line-height:.85}
.cv-chap .w{display:block;font-family:var(--f-display);font-style:italic;font-weight:500;font-size:clamp(30px,6vw,42px);color:var(--gilt)}
.cv-chap .n{display:block;font-family:var(--f-display);font-weight:800;font-size:clamp(120px,24vw,176px);
  background:linear-gradient(180deg,var(--gilt-2) 10%,var(--gilt) 55%,#B88A33 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 6px 30px rgba(0,0,0,.25)}
.cv-title{font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:clamp(17px,3.2vw,23px);line-height:1.5;margin:6px auto 0;max-width:30ch;color:var(--cream);text-wrap:balance}
.cv-years{font-family:var(--f-display);font-style:italic;font-size:19px;color:var(--gilt-2);margin-top:10px}
.cv-rule{margin:24px auto;width:180px;height:1px;background:linear-gradient(90deg,transparent,var(--gilt),transparent);position:relative}
.cv-rule::after{content:"✦";position:absolute;left:50%;top:50%;transform:translate(-50%,-55%);color:var(--gilt);font-size:13px;background:var(--cover);padding:0 8px;line-height:1}
.login{display:grid;gap:10px;max-width:340px;margin:0 auto;text-align:left}
.login label{font-size:13px;letter-spacing:.04em;color:var(--gilt-2)}
.login .pw{display:flex;border:1px solid rgba(226,182,91,.6);border-radius:8px;background:rgba(0,0,0,.22);overflow:hidden}
.login input[type=password],.login input[type=text]{flex:1;min-width:0;border:0;background:transparent;color:var(--cream);font:inherit;font-size:16px;padding:12px 14px;outline:none}
.login input::placeholder{color:rgba(251,244,230,.5)}
.login .pw:focus-within{border-color:var(--gilt);box-shadow:0 0 0 3px rgba(226,182,91,.25)}
.login .eye{border:0;background:transparent;color:var(--gilt-2);padding:0 12px;font-size:13px}
.login .remember{display:flex;gap:8px;align-items:center;font-size:13px;color:rgba(251,244,230,.85)}
.login .go{border:0;border-radius:8px;padding:12px 16px;font-weight:700;font-size:15px;letter-spacing:.03em;color:#3A0A0C;background:linear-gradient(180deg,var(--gilt-2),var(--gilt));cursor:pointer}
.login .go:hover{filter:brightness(1.06)}
.login .go:disabled{opacity:.6;cursor:wait}
.login .err{min-height:20px;font-size:13.5px;color:#FFD2CC}
.cover .credit{margin-top:26px;font-size:12.5px;color:rgba(251,244,230,.7);line-height:1.6}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.shake{animation:shake .35s}
.btn.sm{white-space:nowrap}

/* --- Toàn màn hình --- */
.mh-actions{display:flex;gap:8px;align-items:center}
#gate{position:relative}
.gate-fs{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);right:14px;border:1px solid rgba(226,182,91,.55);background:rgba(0,0,0,.2);color:var(--gilt-2);border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer}
.gate-fs:hover{background:rgba(0,0,0,.35)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);z-index:50;max-width:min(92vw,460px);background:#1B1E25;color:#fff;padding:12px 16px;border-radius:10px;font-size:14px;line-height:1.5;box-shadow:0 8px 30px rgba(0,0,0,.3)}
:fullscreen body,:-webkit-full-screen body{overflow-y:auto}
:fullscreen{background:var(--bg);overflow-y:auto}
@media (max-width:640px){.fs-toggle span{display:none}}
@media (max-width:640px){#gate{padding-top:64px}}
</style>
</head>

(function(){
  const KEYSTORE='lsd-c3-key';
  const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  const b64e=u=>{let s='';new Uint8Array(u).forEach(b=>s+=String.fromCharCode(b));return btoa(s);};
  const $=id=>document.getElementById(id);
  const ok = !!(window.crypto && crypto.subtle);
  async function derive(pw){
    const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64d(PAYLOAD.s),iterations:PAYLOAD.it,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['decrypt']);
  }
  async function open(key){
    const buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(PAYLOAD.i)},key,b64d(PAYLOAD.c));
    return JSON.parse(new TextDecoder().decode(buf));
  }
  function launch(app){
    $('gate').remove();
    const root=$('root'); root.innerHTML=app.html; root.hidden=false;
    (new Function(app.js))();
    const lo=document.getElementById('logout');
    if(lo) lo.onclick=()=>{ try{localStorage.removeItem(KEYSTORE);sessionStorage.removeItem(KEYSTORE);}catch(e){} location.reload(); };
    window.__bindFS&&window.__bindFS();
    window.scrollTo(0,0);
  }
  async function tryStored(){
    let saved=null;
    try{ saved=JSON.parse(localStorage.getItem(KEYSTORE)||sessionStorage.getItem(KEYSTORE)||'null'); }catch(e){}
    if(!saved||saved.s!==PAYLOAD.s) return false;
    try{
      const key=await crypto.subtle.importKey('raw',b64d(saved.k),{name:'AES-GCM'},true,['decrypt']);
      launch(await open(key)); return true;
    }catch(e){ return false; }
  }
  /* ----- Toàn màn hình ----- */
  const de=document.documentElement;
  const fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement;
  const canFS=!!(de.requestFullscreen||de.webkitRequestFullscreen);
  let toastT=null;
  function toast(msg){ const t=$('toast'); if(!t) return; t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,6000); }
  function syncFS(){ const on=!!fsEl(); document.querySelectorAll('.fs-toggle').forEach(b=>{ b.querySelector('span').textContent=on?'Thoát toàn màn hình':'Toàn màn hình'; b.setAttribute('aria-pressed',on); }); }
  function toggleFS(){
    if(!canFS){ toast('Trình duyệt này chưa hỗ trợ toàn màn hình. Trên iPhone: bấm nút Chia sẻ → “Thêm vào Màn hình chính”, rồi mở từ biểu tượng đó để dùng toàn màn hình.'); return; }
    try{
      if(fsEl()) (document.exitFullscreen||document.webkitExitFullscreen).call(document);
      else { const r=(de.requestFullscreen||de.webkitRequestFullscreen).call(de); if(r&&r.catch) r.catch(()=>toast('Không bật được toàn màn hình. Thử nhấn phím F11 (máy tính).')); }
    }catch(e){ toast('Không bật được toàn màn hình. Thử nhấn phím F11 (máy tính).'); }
  }
  window.__bindFS=()=>{ document.querySelectorAll('.fs-toggle').forEach(b=>b.onclick=toggleFS); syncFS(); };
  document.addEventListener('fullscreenchange',syncFS); document.addEventListener('webkitfullscreenchange',syncFS);
  document.addEventListener('keydown',e=>{ if((e.key==='f'||e.key==='F')&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!e.target.matches('input,select,textarea')){ e.preventDefault(); toggleFS(); } });
  window.__bindFS();
  if(!ok){ $('err').textContent='Trình duyệt chưa hỗ trợ giải mã. Hãy mở trang qua địa chỉ https:// bằng Chrome, Edge, Safari hoặc Firefox bản mới.'; $('go').disabled=true; return; }
  tryStored();
  $('eye').onclick=()=>{const i=$('pw');const show=i.type==='password';i.type=show?'text':'password';$('eye').textContent=show?'Ẩn':'Hiện';};
  $('loginForm').onsubmit=async e=>{
    e.preventDefault();
    const pw=$('pw').value; if(!pw){ $('err').textContent='Vui lòng nhập mật khẩu.'; return; }
    $('go').disabled=true; $('go').textContent='Đang mở…'; $('err').textContent='';
    try{
      const key=await derive(pw); const app=await open(key);
      try{
        const rec=JSON.stringify({s:PAYLOAD.s,k:b64e(await crypto.subtle.exportKey('raw',key))});
        ($('remember').checked?localStorage:sessionStorage).setItem(KEYSTORE,rec);
      }catch(_){}
      launch(app);
    }catch(err){
      $('go').disabled=false; $('go').textContent='Vào ôn tập';
      $('err').textContent='Mật khẩu chưa đúng. Kiểm tra lại chữ hoa, chữ thường và thử lần nữa.';
      const c=$('cover'); c.classList.remove('shake'); void c.offsetWidth; c.classList.add('shake');
      $('pw').select();
    }
  };
})();
</script>
